# The Telegram bot: messages to the phone, buttons, and the `jarvis telegram` CLI lines.

[bot]
greeting = "Hi, Jarvis here. Type or send a voice message; /help shows what I can do."
unsupported = "For now I only understand text and voice messages."
new_session = "New session started."
turn_error = "ℹ️ Something went wrong in this turn ({error}). Details are in the log on the Mac."
stopped = "Stopped. To turn me back on: /start here and `jarvis telegram enable` on the Mac."
reenable_requested = "Got the request to turn back on. I'll carry on once `jarvis telegram enable` runs on the Mac."

# {team} is football.team from the config.
[help]
text = """What I can do from the phone:
• Calendar (agenda, creating events - with confirmation)
• Reminders
• Gmail: search, read, drafts (with confirmation)
• Weather, web search and reading pages
• {team}: matches, standings
• Daily brief, timers, pomodoro
• Training log, memory
• Voice messages: I first write what I understood, then answer
• Location: share your location from the phone (/location) and weather and travel times are worked out from there; the Mac's location is never used when you ask from the phone
• If the Mac is left on: /status (battery, idle time, screen lock), /lock (lock the screen), /sleep (with confirmation; say "cancel" before it sleeps to call it off), "put the Mac to sleep at 23:00" (warns a minute before). No shutdown or restart.
• Alarms: "set an alarm for 7 tomorrow morning" rings on the Mac, and a reminder plus a Telegram message reach the phone; /stop_alarm stops a ringing alarm, /snooze [min] snoozes it (typing "ok", "stop" or "snooze" works too)
• Morning brief: arrives by itself every morning (spoken when you're at the Mac, here otherwise); /brief sends it now; "move the morning brief to 7:30", "no brief on weekends", "turn the brief off" change it

Commands: /start, /help, /new (new session), /location (share-location button), /mute [60m] and /unmute (pause / resume voice listening on the Mac), /status, /lock, /sleep [seconds], /stop_alarm, /snooze [min], /brief (today's brief), /stop (emergency off)
Shell, file, app, screen and clipboard tools are off from the phone."""

