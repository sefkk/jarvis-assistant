# {team}: config'teki football.team.
[help]
text = """Telefondan yapabildiklerim:
• Takvim (ajanda, etkinlik oluşturma - onaylı)
• Hatırlatıcılar
• Gmail: arama, okuma, taslak (onaylı)
• Hava durumu, web araması ve sayfa okuma
• {team}: maçlar, puan durumu
• Günlük özet, zamanlayıcılar, pomodoro
• Antrenman günlüğü, hafıza
• Sesli mesaj: önce ne anladığımı yazarım, sonra cevaplarım
• Konum: telefondan konumunu paylaşırsan (/location) hava durumu ve yol süresi oradan hesaplanır; Mac'in konumu telefondan sorulduğunda kullanılmaz
• Mac açık kaldıysa: /status (pil, boşta süresi, ekran kilidi), /lock (ekranı kilitle), /sleep (onaylı; uyumadan önce "iptal" ile vazgeçersin), "saat 23:00'de uyut" (1 dk önce haber verir). Kapatma ve yeniden başlatma yok.
• Alarm: "yarın sabah 7'de alarm kur" Mac'te çalar, telefona hatırlatıcı + Telegram mesajı gelir; /stop_alarm çalan alarmı durdurur, /snooze [dk] erteler ("tamam", "kapat", "ertele" yazmak da olur)
• Sabah özeti: her sabah kendiliğinden gelir (Mac'teyken sesli, değilken buraya); /brief şimdi gönderir; "sabah özetini 7:30'a al", "hafta sonu özet gönderme", "özeti kapat" ayarı değiştirir

Komutlar: /start, /help, /new (yeni oturum), /location (konum paylaş düğmesi), /mute [60m] ve /unmute (Mac'teki sesli dinlemeyi durdur / aç), /status, /lock, /sleep [saniye], /stop_alarm, /snooze [dk], /brief (günün özeti), /stop (acil kapatma)
Telefondan kabuk, dosya, uygulama, ekran ve pano araçları kapalıdır."""

