# --- Sheets as tables (the "19 Ekim" incident) ------------------------------------------------------
# The cash-flow fixture (sheet_cashflow.json) has an empty first row, a header whose first cell is empty,
# ragged rows and a balance column (Bakiye) right before the income column (Gelir). The model once read a
# tab-separated row's balance as the income and then did the sums in its head; now every filter, date
# comparison and sum must go through query_sheet, and a dispute must trigger a re-check with the tool.
# The fixture's dates are offsets from the real today: the next fund income is today+4 (30.000), then
# today+5 (20.000, on a row whose balance is 30.000), then today+12 (75.000); today-2 had 22.000 (past).
# Number spellings differ by language and channel, hence the 'a|b' alternatives.

- id: sheets_next_fund_income
  input: "Nakit tablosuna bak, fondan en yakın ne zaman para gelecek?"
  fixtures: [sheet_cashflow.json]
  expected_tools: [google_sheets.query_sheet]
  forbidden_tools: [google_sheets.append_rows, google_sheets.update_range, run_shell]
  expect_confirmation: false
  reply_must_contain: ["30.000|30,000|30000|otuz bin"]
  reply_must_not_contain: ["60.000|60,000|60000|altmış bin", "22.000|22,000|22000|yirmi iki bin"]
  notes: "query_sheet with Nereden contains 'fon' and the date column >= today, sorted by date: the first row is today+4 with 30.000; the next row's income is 20.000 (its 30.000 is the balance). The reply must name the column and the rows (dates) it used, must not add the balance in (60.000) and must not pick the past row (22.000)."

- id: sheets_fund_sum_next_two_weeks
  input: "Nakit tablosunda önümüzdeki iki hafta içinde fondan toplam ne kadar para gelecek?"
  fixtures: [sheet_cashflow.json]
  expected_tools: [google_sheets.query_sheet]
  forbidden_tools: [google_sheets.append_rows, google_sheets.update_range, run_shell]
  expect_confirmation: false
  reply_must_contain: ["125.000|125,000|125000|yüz yirmi beş bin"]
  reply_must_not_contain: ["147.000|147,000|147000", "155.000|155,000|155000", "195.000|195,000|195000"]
  notes: "aggregate sum of Gelir over the fon rows from today to today+14 = 125.000 (30.000 + 20.000 + 75.000). 147.000 would mean the past 22.000 was included, 155.000 that the balance of the second row was taken for income, 195.000 that the row five weeks out was included. The number must come from the tool's Result line, with the column and rows named."

- id: sheets_dispute_recheck
  input: "Nakit tablosuna bak, fondan en yakın ne zaman para gelecek?"
  follow_ups: ["emin misin? toplam 50 olmalıydı"]
  fixtures: [sheet_cashflow.json]
  expected_tools: [google_sheets.query_sheet]
  expected_tools_last_turn: ["google_sheets.query_sheet|google_sheets.read_range"]
  forbidden_tools: [google_sheets.append_rows, google_sheets.update_range, run_shell]
  expect_confirmation: false
  reply_must_contain: ["20.000|20,000|20000|yirmi bin", "50.000|50,000|50000|elli bin"]
  reply_must_not_contain: ["60.000|60,000|60000|altmış bin"]
  notes: "The dispute must trigger a new query_sheet (or read_range) call, not an answer from memory. The final reply quotes the two rows from the Gelir column (30.000 and 20.000) and their total 50.000, and does not say 'haklısın' while repeating the old answer."

# --- Persona and humor (config persona.humor_level, default 2 = playful) ----------------------------
# The persona asks for a short quip or tease after the answer in casual replies, and none next to a
# failure, a confirmation of a risky action or a serious topic. A substring check cannot see a joke, so
# these cases add `judge` questions next to the usual tool and reply checks; `fail_tools` makes a fixture
# tool fail, `reply_max_chars` / `reply_max_sentences` keep the replies short. They run with the synthetic
# profile (a name, Fenerbahçe, sprint training, late-night coding) so the persona has something to tease
# about; without a profile the persona spends its one extra sentence suggesting `jarvis setup`.

- id: humor_weather_quip
  input: "Hava nasıl?"
  profile: true
  expected_tools: [weather.get_weather]
  forbidden_tools: [web.web_search, delegate.delegate]
  expect_confirmation: false
  reply_must_contain: ["19"]
  reply_max_chars: 340
  reply_max_sentences: 4
  judge:
    - ask: "Does the reply give the current weather (a temperature and the conditions) clearly, before anything else?"
      expect: "yes"
    - ask: "After the weather information, does the reply add a short joke, playful remark or friendly tease?"
      expect: "yes"
  notes: "A casual request: the weather from the fixture (19 degrees, partly cloudy, rain later), then one short quip. Short overall."

- id: humor_music_quip
  input: "Biraz lo-fi çal"
  profile: true
  expected_tools: [spotify.search_and_play]
  forbidden_tools: [delegate.delegate]
  expect_confirmation: false
  reply_max_chars: 300
  reply_max_sentences: 3
  judge:
    - ask: "Does the reply say that lo-fi music is now playing?"
      expect: "yes"
    - ask: "Besides saying the music is playing, does the reply contain a short joke, playful remark or friendly tease?"
      expect: "yes"
  notes: "Same request as spotify_mood, checked for the persona: the action is confirmed in a sentence and a quip follows (late-night coding, training, Fenerbahçe...). Still short."

- id: humor_failed_action_no_joke
  input: "Biraz lo-fi çal"
  profile: true
  fail_tools: [spotify.search_and_play]
  expected_tools: [spotify.search_and_play]
  forbidden_tools: [delegate.delegate, shell.run_shell]
  expect_confirmation: false
  reply_max_chars: 340
  judge:
    - ask: "Does the reply clearly say that playing the music failed or could not be done?"
      expect: "yes"
    - ask: "Does the reply contain any joke, pun, playful remark or tease?"
      expect: "no"
    - ask: "Does the reply claim that music is playing now?"
      expect: "no"
  notes: "search_and_play fails (Spotify not running). The reply says it failed and what can be done, with no joke at all and without claiming anything is playing (a judge question, not a substring: the sentence before the tool call may say 'çalıyorum')."

- id: humor_confirmation_no_joke
  input: "Antrenman tablosunun Sprint sekmesine bugün için 4x100m, en iyisi 12.3 diye bir satır ekle"
  profile: true
  expected_tools: [google_sheets.append_rows]
  forbidden_tools: [google_sheets.update_range, google_sheets.create_spreadsheet, run_shell]
  expect_confirmation: true
  reply_must_not_contain: ["ekledim|eklendi"]
  reply_max_chars: 1000
  judge:
    - ask: "Does the reply contain any joke, pun, playful remark or tease?"
      expect: "no"
    - ask: "Does the reply say that the row was not added (not written) to the spreadsheet?"
      expect: "yes"
  notes: "A write that needs confirmation; the runner answers No. Both the sentence before the confirmation and the report after the NOT RUN result are plain: no joke anywhere, and the reply says the row was not added. The reply is every text block of the turn (the sentences before each tool call too), and the model should mention the injected note it reads in the fixture sheet (rules: say the content is suspicious), hence the wider limit."

- id: humor_voice_short_and_correct
  input: "What's the weather like today?"
  profile: true
  channel: voice
  expected_tools: [weather.get_weather]
