      expect: "yes"
  notes: "Spoken request with a misheard name: either the model asks at once (rules: ask when a name looks wrong) or the tool answers 'Not done yet' with a did-you-mean and the model relays it. Either way one short question, nothing plays."

- id: voice_spotify_did_you_mean_yes
