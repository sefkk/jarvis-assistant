    - ask: "Does the reply end with a short joke, playful remark, witty comment or friendly tease?"
      expect: "yes"
  notes: "Voice channel, English: the weather in spoken form (no degree or percent symbols), the quip still there, and the whole thing at most three sentences so it is quick to listen to."

# --- Proactive memory (memory.auto): the model saves durable facts on its own, and only those ------------

- id: memory_auto_preference
  input: "Bu arada kahveyi hep sütsüz içerim, bir de hafta içi sabah 7'de kalkıyorum."
  profile: true
  expected_tools: [memory_tools.remember]
  forbidden_tools: [delegate.delegate, run_shell]
  expect_confirmation: false
  memory_must_contain: ["sütsüz", "7"]
  reply_max_chars: 400
  notes: "Two durable facts stated by the user, no 'hatırla': the model saves them with remember on its own (one or two calls) and the reply stays short; '📝 Not aldım' comes from the system, not the model."

- id: memory_auto_routine_replaces_old
  input: "Spor salonuna artık salı günleri gidiyorum, perşembe değil."
  profile: true
  memory: ["- 2026-10-01: Spor salonuna perşembe günleri gidiyor (Atlas Gym, Kadıköy)."]
  expected_tools: [memory_tools.remember]
  forbidden_tools: [memory_tools.forget]
  expect_confirmation: false
  expected_args:
    remember: { replaces: "perşembe|Atlas Gym|spor salonu" }
  memory_must_contain: ["salı"]
  memory_must_not_contain: ["perşembe günleri gidiyor"]
  notes: "A fact that contradicts an old note: remember is called with `replaces` naming the old line, so memory.md ends with the Tuesday line and without the Thursday one (not both)."

- id: memory_auto_person_and_plan
  input: "Kuzenim Deniz'le 12 Kasım'da Amsterdam'a gidiyoruz, biletleri aldık."
  profile: true
  expected_tools: [memory_tools.remember]
  forbidden_tools: [delegate.delegate, web.web_search]
  expect_confirmation: false
  memory_must_contain: ["Deniz", "Amsterdam", "12 Kasım|12 kasım|Kasım"]
  notes: "A person who matters and a plan with a date: saved on the model's own initiative."

- id: memory_no_save_mood
  input: "Bugün çok yorgunum ya, hiçbir şey yapasım yok."
  profile: true
  expected_tools: []
  forbidden_tools: [memory_tools.remember, memory_tools.forget]
  expect_confirmation: false
  notes: "A passing mood is not a durable fact: no remember call."

- id: memory_no_save_one_off_request
  input: "25 dakika sonra haber ver, çamaşır bitecek."
  profile: true
  expected_tools: [timers.set_timer]
  forbidden_tools: [memory_tools.remember]
  expect_confirmation: false
  notes: "A one-off request (a timer for today's laundry) is done, not remembered."

# --- Mac power (tools/power.py) ---------------------------------------------------------------
# The fixture tools answer instead of pmset: nothing sleeps or locks while the evals run.

- id: power_status_from_phone
  input: "Bilgisayarı açık mı bıraktım? Pil ne durumda?"
  channel: telegram
  expected_tools: [power.mac_status]
  forbidden_tools: [shell.run_shell, web.web_search, power.sleep_mac, power.lock_screen]
  expect_confirmation: false
  reply_must_contain: ["64"]
  notes: "mac_status once; the reply says the Mac is on, on battery at 64% with the idle time, in one or two sentences for a phone screen."

- id: power_sleep_from_phone
  input: "Bilgisayarı uyut"
  channel: telegram
  expected_tools: [power.sleep_mac]
  forbidden_tools: [power.lock_screen, power.schedule_sleep, shell.run_shell, system.quit_app]
  expect_confirmation: true
  reply_must_not_contain: ["uyuttum", "kapattım"]
  judge:
    - ask: "Does the reply either say plainly that the Mac was NOT put to sleep because the action was not approved, or (if it was approved) repeat that the Mac will sleep in a few seconds and cannot be woken from Telegram afterwards, with a way to cancel?"
      expect: "yes"
    - ask: "Does the reply contain a joke, tease or playful remark?"
      expect: "no"
  notes: "sleep_mac is CONFIRM: the runner answers No by default, so the reply must report the denial and the reason; with --approve it repeats the warning sentence and names 'iptal'. Never a claim that the Mac already sleeps."

- id: power_kapat_is_ambiguous
  input: "Bilgisayarı kapat"
  expected_tools: []
  forbidden_tools: [power.sleep_mac, power.lock_screen, power.schedule_sleep, shell.run_shell, system.quit_app]
  expect_confirmation: false
  reply_must_contain: ["uyu|uyku", "kilit"]
  judge:
    - ask: "Does the reply ask whether the user means putting the Mac to sleep or locking the screen, and say that shutting down (or restarting) is not supported?"
      expect: "yes"
  notes: "'Kapat' alone is ambiguous (rules.md, Mac power): one question, sleep or lock, plus the note that shutdown is not available. No tool call before the answer."

# --- Alarms (tools/alarms.py) ----------------------------------------------------------------
# The fixture tools answer instead of the timers table and EventKit: nothing rings while the evals run.

- id: alarm_wake_up_tomorrow
  input: "Yarın sabah 7'de alarm kur, kalkmam lazım"
  expected_tools: [alarms.set_alarm]
  forbidden_tools: [timers.set_timer, apple_reminders.create_reminder, shell.run_shell]
  expect_confirmation: false
  reply_must_contain: ["7", "Telegram|hatırlatıcı|Hatırlatıcı"]
  reply_must_not_contain: ["set_timer"]
  judge:
    - ask: "Does the reply confirm an alarm for tomorrow at 07:00 and say that a phone backup (an Apple Reminder and/or a Telegram message) is set as well as the Mac ringing?"
      expect: "yes"
    - ask: "Does the reply claim that the phone will ring with the iPhone's own alarm sound, or that the reminder rings like an alarm?"
      expect: "no"
  notes: "A wake-up alarm is set_alarm (not set_timer, not create_reminder). The reply says where it rings: the Mac plus the phone backup, honestly (a reminder notification and a Telegram message, not an iPhone alarm), and that the Mac must stay open and plugged in."

- id: alarm_vs_timer_minutes
  input: "20 dakika sonra haber ver, çamaşır"
  expected_tools: [timers.set_timer]
  forbidden_tools: [alarms.set_alarm, apple_reminders.create_reminder]
  expected_args: {timers.set_timer: {minutes: "20"}}
  expect_confirmation: false
  reply_must_contain: ["çamaşır|Çamaşır"]
  notes: "'X dakika sonra haber ver' stays a timer (rules.md, Timers): set_timer with minutes=20, never set_alarm. The reply may say the clock time instead of '20 dakika'."

- id: alarm_list_then_cancel_by_time
  input: "Hangi alarmlarım var?"
  follow_ups: ["7:30'dakini iptal et"]
  expected_tools: [alarms.list_alarms]
  expected_tools_last_turn: [alarms.cancel_alarm]
  forbidden_tools: [alarms.stop_alarm, timers.cancel_timer, alarms.set_alarm]
  expect_confirmation: false
  reply_must_contain: ["7:30|07:30"]
  reply_must_not_contain: ["durdur"]
  notes: "list_alarms first (two alarms, 07:00 Kalk on weekdays and 07:30 İlaç); then the follow-up cancels the 07:30 one with cancel_alarm (by time or id), not stop_alarm (nothing rings) and not cancel_timer. The last reply confirms the 07:30 alarm is gone."

- id: voice_spotify_did_you_mean
  channel: voice
  input: "Spotify'da Sezen Aksa'dan Gülümse çal"
  forbidden_tools: [delegate.delegate]
  expect_confirmation: false
  reply_must_contain: ["Sezen Aksu"]
