# --- the brief message (2026-10-19 review): no commentary, direct searches, home weather, the greeting, the mail ---

- id: brief_telegram_no_commentary
  channel: telegram
  input: &brief_telegram_prompt "System event: the scheduled morning brief, sent to Telegram as a message. Call daily_brief once for today and write it in the user's language (tr) as a compact list: one line with a greeting by name that fits the local time on the brief's first line (good morning only in the morning), then one short line per item for today's events from both calendars (say which calendar), the weather where the user is now (or at home when the brief says so), whether Fenerbahçe plays today (time, opponent, competition) and yesterday's result if there was a match, the reminders due today, the alarms and timers set for today, and how many emails came in today with the important ones named. Leave out what is empty; a failed part gets half a line. End with the last item: no closing remark, joke or advice. If the football section says the match was not found, do one web_search."
  fixtures: [brief_no_match.txt]
  expected_tools: [brief.daily_brief, web.web_search]
  forbidden_tools: [football.team_fixtures, football.team_results, football.league_standings]
  expect_confirmation: false
  reply_must_not_contain: ["bakıyorum|arıyorum|deniyorum|alıyorum|hazırlıyorum|kontrol ediyorum|hata verdi"]
  judge:
    - ask: "Does the reply contain a status line about what the assistant is doing or about a tool error or a retry (for example 'arama yapıyorum', 'tekrar deniyorum', 'brief'i alıyorum')?"
      expect: "no"
  notes: "The reply is the brief only: the status lines the model writes before daily_brief and the web search are not part of it (Brain: the text after the last tool block)."

